name: Publish VS Code Extension

# Publishes the `dot-vscode` extension to the VS Code Marketplace (vsce) and
# Open VSX (ovsx). Unlike the npm packages (release.yml, OIDC trusted
# publishing), these registries do NOT support OIDC, so this uses tokens:
#   - VSCE_PAT  Azure DevOps PAT for the `knowvah` Marketplace publisher
#               (scope: Marketplace > Manage)
#   - OVSX_PAT  Open VSX access token for the `knowvah` namespace
# Store both as secrets on the `vscode-marketplace` environment.
#
# dot-vscode is versioned MANUALLY (release-please excludes it). The version
# published is packages/vscode/package.json's `version`. To release: bump that,
# merge, then either run this workflow (Actions > Run workflow) or push a tag
# `dot-vscode-v<version>`. Re-publishing an already-published version fails.
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'dot-vscode-v*'

concurrency: publish-vscode-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build every package: the extension's esbuild bundle resolves
      # @knowvah/dot-core and @knowvah/dot-markdown-it via their dist/ output.
      - run: pnpm -r build

      # Package the vsix once, then publish the SAME artifact to both registries.
      - name: Package vsix
        id: pack
        working-directory: packages/vscode
        run: |
          set -euo pipefail
          pnpm package
          version="$(node -p "require('./package.json').version")"
          vsix="dot-vscode-${version}.vsix"
          test -f "$vsix"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "Packaged dot-vscode $version -> $vsix"

      # For a tag trigger, refuse to publish if the tag and the packaged version
      # disagree (guards against a stale tag).
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="dot-vscode-v${{ steps.pack.outputs.version }}"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match packaged version ($expected)"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath "${{ steps.pack.outputs.vsix }}"

      - name: Publish to Open VSX
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish "${{ steps.pack.outputs.vsix }}"
